<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AdPilot — Call-focused media buying</title><meta name="description" content="A client workspace for Meta Ads, Google Ads, SEO, and call-focused campaign planning."><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body>
<aside class="sidebar"><a class="brand" href="#overview"><span class="brand-icon">↗</span>adpilot<span class="brand-dot">.</span></a><div class="workspace-label">YOUR WORKSPACE</div><nav id="nav" aria-label="Main navigation"></nav><div class="sidebar-bottom"><div class="status-dot"></div><span>Built for better calls</span><small>Plan · Create · Measure</small></div></aside>
<div class="app-shell"><header class="topbar"><div class="breadcrumbs">Workspace <span>/</span> <strong id="crumb">Overview</strong></div><div class="top-actions"><label class="sr-only" for="client-select">Select client</label><select id="client-select"></select><button class="avatar" id="client-add" aria-label="Add client">+</button></div></header>
<main id="main"></main><footer>AdPilot workspace · Drafts and imports stay in this browser. Export backups to keep your work.</footer></div>
<dialog id="client-dialog"><form id="client-form"><div class="eyebrow">CLIENT WORKSPACE</div><h2>Add a client</h2><label>Business name<input name="name" required maxlength="100" placeholder="e.g. Acme Plumbing"></label><label>Service or product<input name="service" required maxlength="150" placeholder="e.g. Emergency plumbing"></label><label>Target location<input name="location" required maxlength="100" placeholder="City, region, country"></label><label>Lead phone number<input name="phone" type="tel" required maxlength="30" placeholder="Include country code"></label><label>Reporting currency<select name="currency"><option>USD</option><option>PHP</option><option>AUD</option><option>GBP</option><option>EUR</option><option>CAD</option></select></label><div class="dialog-actions"><button type="button" class="secondary" id="client-cancel">Cancel</button><button class="primary" type="submit">Create workspace</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
